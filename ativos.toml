# Lista de ativos acompanhados pelo NewsMarket.
# ticker: código na B3 (sem o .SA; o sufixo é colocado automaticamente)
# tipo:   "fii" ou "acao"
# termos: palavras usadas para buscar e associar notícias ao ativo.
#         Inclua o ticker, o nome do fundo/empresa e o gestor quando fizer sentido.

[[ativo]]
ticker = "MXRF11"
tipo = "fii"
termos = ["MXRF11", "Maxi Renda"]

